<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S</title>
<style>
@font-face{font-family:'Rajdhani';src:url('fonts/Rajdhani-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Rajdhani';src:url('fonts/Rajdhani-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'Rajdhani';src:url('fonts/Rajdhani-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'Rajdhani';src:url('fonts/Rajdhani-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'Orbitron';src:url('fonts/Orbitron-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'Orbitron';src:url('fonts/Orbitron-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
:root{
  color-scheme:dark;
  --bg:#08080a; --bg2:#121316; --glass:rgba(255,255,255,.045); --line:rgba(255,255,255,.10);
  --cy:#e8f1ff; --cy-dim:#8a8d94; --text:#ececef; --mute:#8a8d94; --warn:#ffb347; --ok:#4dffb0; --err:#ff6b7d;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  box-sizing:border-box; padding-top:var(--safe-t); padding-bottom:var(--safe-b);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 50% 38%,#202227 0%,var(--bg2) 45%,var(--bg) 100%);
  color:var(--text);font-family:'Rajdhani','Segoe UI',sans-serif;font-size:16px;overflow:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 70%);
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 70%)}
.app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:18px 22px;max-width:1400px;margin:auto}
.mono{font-family:'JetBrains Mono',Consolas,monospace}

/* top bar */
.top{display:flex;align-items:center;justify-content:center;position:relative;min-height:46px}
.brand{position:absolute;left:0;font-family:'Orbitron','Segoe UI',sans-serif;font-size:12px;letter-spacing:.3em;color:var(--cy-dim)}
.clock{position:absolute;right:0;text-align:right;color:var(--mute);font-size:13px;letter-spacing:.12em}
.clock b{display:block;color:var(--text);font-size:20px;font-weight:600;letter-spacing:.08em}
.np{display:flex;align-items:center;gap:12px;padding:7px 16px 7px 8px;border-radius:999px;background:var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(14px);width:min(360px,60vw)}
.art{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 0deg,var(--cy),#50545b,var(--cy));animation:spin 6s linear infinite;
  display:grid;place-items:center;flex:none}
.art::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--bg)}
.np .meta{min-width:0;flex:1}
.np .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .a{font-size:12px;color:var(--mute);letter-spacing:.06em}
.bar{height:2px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:38%;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.ctl{display:flex;gap:4px}
.ctl button{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--cy)}
.ctl button:hover{background:rgba(232,241,255,.12)}

/* main */
.main{display:grid;grid-template-columns:270px 1fr 270px;gap:22px;min-height:0;align-items:center}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px;backdrop-filter:blur(16px);
  box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 20px 50px -20px rgba(0,0,0,.6);position:relative}
.panel::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--cy),transparent);opacity:.6}
.panel h3{font-family:'Orbitron','Segoe UI',sans-serif;font-weight:500;font-size:11px;letter-spacing:.28em;color:var(--cy-dim);margin-bottom:16px}
.gauges{display:flex;justify-content:space-around;margin-bottom:18px}
.g{position:relative;width:92px;height:92px}
.g svg{width:100%;height:100%;transform:rotate(-90deg)}
.g circle{fill:none;stroke-width:6;stroke-linecap:round}
.g .bg{stroke:rgba(232,241,255,.1)}
.g .fg{stroke:var(--cy);filter:drop-shadow(0 0 5px var(--cy));transition:stroke-dashoffset .8s}
.g.warn .fg{stroke:var(--warn);filter:drop-shadow(0 0 5px var(--warn))}
.g .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.g .v b{font-size:22px;font-weight:600;line-height:1}
.g .v span{font-size:11px;color:var(--mute);letter-spacing:.2em}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;background:rgba(232,241,255,.05);
  border:1px solid var(--line);font-size:14px;letter-spacing:.14em}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-right:10px;animation:pulse 2.4s infinite}
.chip em{font-style:normal;color:var(--mute);font-size:12px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(232,241,255,.07);font-size:13px}
.row span:first-child{color:var(--mute);letter-spacing:.2em;font-size:12px;font-family:'Rajdhani',sans-serif}
.spark{width:100%;height:44px;margin:12px 0 4px}
.timer{margin:16px auto 0;width:104px;height:104px;border-radius:50%;border:1px dashed var(--cy-dim);display:grid;place-content:center;text-align:center;
  background:radial-gradient(circle,rgba(232,241,255,.08),transparent 70%)}
.timer span{font-size:11px;color:var(--mute);letter-spacing:.24em}.timer b{font-size:15px;letter-spacing:.14em}

/* reactor */
.core{display:grid;place-items:center;min-height:0}
.reactor{position:relative;width:min(100%,460px,52vh);aspect-ratio:1;cursor:pointer;user-select:none}
.reactor svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.r1{animation:spin 60s linear infinite;transform-origin:50% 50%}
.r2{animation:spin 28s linear infinite reverse;transform-origin:50% 50%}
.r3{animation:spin 14s linear infinite;transform-origin:50% 50%}
.glow{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle,rgba(232,241,255,.35),transparent 68%);filter:blur(18px);animation:breathe 4s ease-in-out infinite}
.label{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.label h1{font-family:'Orbitron','Segoe UI',sans-serif;font-weight:700;font-size:clamp(20px,3.2vw,30px);letter-spacing:.14em;
  text-shadow:0 0 18px rgba(232,241,255,.7)}
.label p{margin-top:6px;font-size:13px;letter-spacing:.42em;color:var(--cy);transition:color .3s}
.reactor[data-s=listening] .glow{animation-duration:1.2s;background:radial-gradient(circle,rgba(77,255,176,.4),transparent 68%)}
.reactor[data-s=listening] .label p{color:var(--ok)}
.reactor[data-s=thinking] .r1,.reactor[data-s=thinking] .r2,.reactor[data-s=thinking] .r3{animation-duration:4s}
.reactor[data-s=thinking] .label p{color:var(--warn)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.log{display:flex;flex-direction:column;gap:8px;max-height:150px;overflow:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--cy-dim) transparent}
.msg{max-width:min(620px,86%);padding:9px 14px;border-radius:14px;font-size:16px;line-height:1.3;border:1px solid var(--line);animation:rise .35s ease}
.msg small{display:block;font-size:10px;letter-spacing:.26em;color:var(--cy-dim);margin-bottom:2px}
.msg.ai{align-self:flex-start;background:var(--glass);border-top-left-radius:4px}
.msg.me{align-self:flex-end;background:rgba(232,241,255,.14);border-color:rgba(232,241,255,.3);border-top-left-radius:14px;border-top-right-radius:4px}
.msg.err{border-color:rgba(255,107,125,.4);background:rgba(255,107,125,.08)}
.msg.err small{color:var(--err)}
.msg button{all:unset;cursor:pointer;margin-left:8px;color:var(--cy);font-size:13px;letter-spacing:.14em;border-bottom:1px solid var(--cy-dim)}
.input{display:flex;gap:10px;align-items:center}
.field{flex:1;display:flex;align-items:center;padding:0 8px 0 20px;height:54px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px);transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--cy);box-shadow:0 0 0 4px rgba(232,241,255,.12),0 0 24px rgba(232,241,255,.2)}
.field input{all:unset;flex:1;color:var(--text);font-size:17px;letter-spacing:.03em}
.field input::placeholder{color:var(--mute)}
.send,.mic{all:unset;cursor:pointer;display:grid;place-items:center;border-radius:50%;transition:transform .15s,box-shadow .2s}
.send{width:40px;height:40px;color:var(--cy)}.send:hover{background:rgba(232,241,255,.14)}
.mic{width:54px;height:54px;background:linear-gradient(145deg,#ffffff,#b4b9c4);color:#0a0a0c;box-shadow:0 0 24px rgba(232,241,255,.5)}
.mic:hover{transform:scale(1.06)}
.mic.on{background:linear-gradient(145deg,#7dffc8,#25c98a);box-shadow:0 0 30px rgba(77,255,176,.6);animation:pulse 1.2s infinite}

/* voice focus mode */
.main{transition:grid-template-columns .6s ease,gap .6s ease}
.panel,.np,.brand,.clock,.log,.field{transition:opacity .45s ease,transform .6s ease,max-height .6s ease,flex .6s ease,padding .6s ease,border-width .6s ease}
.reactor{transition:width .6s ease}
.app.voice .panel,.app.voice .np,.app.voice .brand,.app.voice .clock,.app.voice .log,.app.voice .field{opacity:0;pointer-events:none}
.app.voice .log{max-height:0;padding:0}
.app.voice .input{justify-content:center}
.app.voice .field{flex:0 0 0;padding:0;border-width:0;overflow:hidden}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
@keyframes breathe{50%{transform:scale(1.18);opacity:.75}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .core{order:-1}
  .brand,.clock{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---- live-data additions ---- */
#alert{position:absolute;top:68px;left:50%;transform:translateX(-50%);z-index:5;display:none;padding:7px 18px;border:1px solid var(--cy);border-radius:12px;background:rgba(20,22,26,.9);font-weight:600;letter-spacing:.05em;transition:opacity .45s}
.app.voice #alert{opacity:0}
.art.cover{animation:none;background-size:cover;background-position:center;border-radius:8px;border:1px solid var(--line)}
.art.cover::after{display:none}
.g.err .fg{stroke:var(--err);filter:drop-shadow(0 0 5px var(--err))}
.chip:not([data-s=ON]) i{background:var(--mute);box-shadow:none;animation:none}
.chip[data-s=OFF] i{background:var(--err);box-shadow:0 0 8px var(--err)}
.chip[data-s=OFF] em{color:var(--err)}
.timer{border:0;position:relative;display:block;background:none}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:4;stroke-linecap:round}
.timer .bgc{stroke:rgba(255,255,255,.1)}.timer .fgc{stroke:var(--cy);transition:stroke-dashoffset .9s linear}
.timer .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.timer small{position:absolute;left:-20px;right:-20px;bottom:-20px;text-align:center;font-size:12px;color:var(--mute);letter-spacing:.1em}
.mic.busy{background:#3a3c42;color:var(--mute);box-shadow:none;cursor:default;transform:none}
.reactor[data-s=speaking] .glow{animation-duration:.9s;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 68%)}
.reactor[data-s=speaking] .r1,.reactor[data-s=speaking] .r2,.reactor[data-s=speaking] .r3{animation-duration:6s}
.log{user-select:text}

/* ---- voice overlay: your circle, shown on its own ---- */
.core{transition:opacity .45s ease}
.app.voice .core{opacity:0;pointer-events:none}
.input{position:relative;z-index:6}
#vov{position:fixed;inset:0 0 96px 0;z-index:4;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .6s ease .15s;cursor:pointer}
.app.voice #vov{opacity:1;pointer-events:auto}
.vreactor{position:relative;width:min(480px,90vw,70vh);aspect-ratio:1;margin:auto}
.vreactor svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.vreactor .r1,.vreactor .r2,.vreactor .r3{transform-origin:50% 50%;transform-box:fill-box}
.vreactor .glow{position:absolute;inset:24%;border-radius:50%;background:radial-gradient(circle,rgba(232,241,255,.3),transparent 68%);filter:blur(18px);animation:breathe 4s ease-in-out infinite}
.vreactor .label{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.vreactor .label h1{font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(18px,2.6vw,28px);letter-spacing:.14em;color:#ececef;text-shadow:0 0 18px rgba(232,241,255,.6)}
.vreactor .label p{margin-top:6px;font-family:'Rajdhani',sans-serif;font-size:13px;letter-spacing:.42em;padding-left:.42em;color:#e8f1ff}
.vreactor[data-s="listening"] .glow{animation-duration:1.1s;background:radial-gradient(circle,rgba(77,255,176,.4),transparent 68%)}
.vreactor[data-s="listening"] .label p{color:#4dffb0}
.vreactor[data-s="thinking"] .r1,.vreactor[data-s="thinking"] .r2,.vreactor[data-s="thinking"] .r3{animation-duration:4s}
.vreactor[data-s="thinking"] .label p{color:#ffb347}
.vreactor[data-s="speaking"] .glow{animation-duration:.9s;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 68%)}
.vreactor[data-s="speaking"] .r1,.vreactor[data-s="speaking"] .r2,.vreactor[data-s="speaking"] .r3{animation-duration:6s}
</style>
</head>
<body>
<div class="app">
  <div id="alert"></div>
  <header class="top">
    <div class="brand">SK.OS</div>
    <div class="np">
      <div class="art" id="art"></div>
      <div class="meta"><div class="t" id="ttl">Nothing playing</div><div class="a" id="art2"></div><div class="bar"><i id="prog" style="width:0"></i></div></div>
      <div class="ctl">
        <button id="bp" aria-label="Previous"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
        <button id="bt" aria-label="Play or pause"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path id="tg" d="M8 5v14l11-7z"/></svg></button>
        <button id="bn" aria-label="Next"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg></button>
      </div>
    </div>
    <div class="clock mono"><b id="clk">--:--</b><span id="dt"></span></div>
  </header>

  <section class="main">
    <aside class="panel">
      <h3>STATUS</h3>
      <div class="gauges">
        <div class="g" id="gc"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"/></svg><div class="v"><b>--</b><span>CPU</span></div></div>
        <div class="g" id="gm"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"/></svg><div class="v"><b>--</b><span>MEM</span></div></div>
      </div>
      <div class="chips">
        <div class="chip" data-k="SPOTIFY"><span><i></i>SPOTIFY</span><em>…</em></div>
        <div class="chip" data-k="VOICE"><span><i></i>VOICE</span><em>…</em></div>
        <div class="chip" data-k="SYSTEM"><span><i></i>SYSTEM</span><em>…</em></div>
      </div>
    </aside>

    <div class="core">
      <div class="reactor" id="reactor" data-s="ready" role="button" tabindex="0" aria-label="Toggle listening">
        <div class="glow"></div>
        <svg viewBox="-200 -200 400 400" fill="none">
          <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#5d616a"/></linearGradient></defs>
          <g class="r1">
            <circle r="188" stroke="rgba(232,241,255,.18)" stroke-width="1" stroke-dasharray="1 7"/>
            <circle r="188" stroke="url(#gr)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90 1090" />
            <circle r="188" stroke="url(#gr)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="40 1140" stroke-dashoffset="-500"/>
          </g>
          <g class="r2">
            <circle r="156" stroke="rgba(232,241,255,.35)" stroke-width="6" stroke-dasharray="2 12.2"/>
            <circle r="156" stroke="url(#gr)" stroke-width="3" stroke-linecap="round" stroke-dasharray="260 720" stroke-dashoffset="-120"/>
          </g>
          <g class="r3">
            <circle r="122" stroke="rgba(232,241,255,.25)" stroke-width="1"/>
            <circle r="122" stroke="var(--cy)" stroke-width="2" stroke-linecap="round" stroke-dasharray="70 697" />
            <circle r="3" cx="122" fill="#ffffff"/><circle r="3" cx="-122" fill="#ffffff"/>
          </g>
          <circle r="92" fill="rgba(8,8,10,.85)" stroke="url(#gr)" stroke-width="2.5" style="filter:drop-shadow(0 0 10px rgba(232,241,255,.6))"/>
          <circle r="80" stroke="rgba(232,241,255,.3)" stroke-width="1"/>
        </svg>
        <div class="label"><h1>J.A.R.V.I.S</h1><p id="state">READY</p></div>
      </div>
    </div>

    <aside class="panel">
      <h3>NETWORK</h3>
      <div class="row mono"><span>LINK</span><span id="nl">…</span></div>
      <div class="row mono"><span>LAN</span><span id="ni">…</span></div>
      <div class="row mono"><span>WAN</span><span id="nw">…</span></div>
      <svg class="spark" viewBox="0 0 200 44" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f1ff" stop-opacity=".4"/><stop offset="1" stop-color="#e8f1ff" stop-opacity="0"/></linearGradient></defs>
        <path id="sp" d="" fill="none" stroke="#e8f1ff" stroke-width="1.5"/><path id="sf" d="" fill="url(#sg)"/></svg>
      <div class="row mono"><span>DOWN</span><span id="nd" style="color:var(--cy)">--</span></div>
      <div class="row mono"><span>UP</span><span id="nu" style="color:var(--ok)">--</span></div>
      <div class="timer"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44"/><circle class="fgc" id="tr" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg>
        <div class="v"><span id="tc">TIMER</span><b id="tv">STANDBY</b></div><small id="tl"></small></div>
    </aside>
  </section>

  <footer class="chat">
    <div class="log" id="log"></div>
    <div class="input">
      <label class="field"><input id="in" placeholder="Ask JARVIS anything…" autocomplete="off">
        <button class="send" id="send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></label>
      <button class="mic" id="mic" aria-label="Voice"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z"/></svg></button>
    </div>
  </footer>
  <div id="vov" aria-label="Voice mode">
    <div class="vreactor" id="vreactor" data-s="ready">
      <div class="glow"></div>
      <svg viewBox="-200 -200 400 400" fill="none">
        <defs><linearGradient id="gr2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#5d616a"/></linearGradient></defs>
        <g class="r1">
          <circle r="188" stroke="rgba(232,241,255,.18)" stroke-dasharray="1 7"/>
          <circle r="188" stroke="url(#gr2)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90 1090"/>
          <circle r="188" stroke="url(#gr2)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="40 1140" stroke-dashoffset="-500"/>
        </g>
        <g class="r2">
          <circle r="156" stroke="rgba(232,241,255,.35)" stroke-width="6" stroke-dasharray="2 12.2"/>
          <circle r="156" stroke="url(#gr2)" stroke-width="3" stroke-linecap="round" stroke-dasharray="260 720" stroke-dashoffset="-120"/>
        </g>
        <g class="r3">
          <circle r="122" stroke="rgba(232,241,255,.25)"/>
          <circle r="122" stroke="#e8f1ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="70 697"/>
          <circle r="3" cx="122" fill="#fff"/><circle r="3" cx="-122" fill="#fff"/>
        </g>
        <circle r="92" fill="rgba(8,8,10,.85)" stroke="url(#gr2)" stroke-width="2.5" style="filter:drop-shadow(0 0 10px rgba(232,241,255,.5))"/>
        <circle r="80" stroke="rgba(232,241,255,.3)"/>
      </svg>
      <div class="label"><h1>J.A.R.V.I.S</h1><p id="vstate">READY</p></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const S={mode:'READY',speaking:false,voice:false,spoke:false,busy:false,vx:0,m:{state:'',position:0,duration:0},at:0,down:[]};
const api=(m,...a)=>{try{return window.pywebview.api[m](...a)}catch(e){}};
const app=$('.app'),reactor=$('#reactor');
const shown=()=>S.speaking?'SPEAKING':(S.mode==='LISTENING'||S.mode==='THINKING')?S.mode:'READY';

function paint(){const s=shown();reactor.dataset.s=s.toLowerCase();$('#state').textContent=s;$('#vreactor').dataset.s=s.toLowerCase();$('#vstate').textContent=s;
 if(S.voice){if(s!=='READY'){S.spoke=true;clearTimeout(S.vx)}
  else if(S.spoke){clearTimeout(S.vx);S.vx=setTimeout(()=>{if(S.voice&&shown()==='READY')voice(false)},3500)}}}

/* ---- voice focus mode: everything fades, only the circle stays ---- */
function voice(on){S.voice=on;S.spoke=false;clearTimeout(S.vx);app.classList.toggle('voice',on);
 if(!on)return;
 if(window.pywebview){setTimeout(()=>{if(S.voice&&!S.busy&&shown()==='READY')api('listen_voice')},800)}else demoVoice()}
$('#mic').onclick=()=>voice(!S.voice);
reactor.onclick=()=>{if(S.voice)voice(false)};$('#vov').onclick=()=>{if(S.voice)voice(false)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.voice)voice(false)});

/* ---- panels ---- */
function gauge(id,v){const g=$(id),n=v==null;g.querySelector('b').textContent=n?'--':Math.round(v)+'%';
 g.querySelector('.fg').style.strokeDashoffset=264*(1-(n?0:v)/100);
 g.classList.toggle('warn',!n&&v>=75&&v<90);g.classList.toggle('err',!n&&v>=90)}
function net(n){const set=(id,t,c)=>{const e=$(id);e.textContent=t;e.style.color=c||''};
 const c=n.online===false?'var(--err)':'';set('#nl',n.name||'…',c);set('#ni',n.ip||'…',c);set('#nw',n.wan||'…');
 set('#nd',n.down_text||'--');set('#nu',n.up_text||'--','var(--ok)');
 S.down.push(n.down||0);if(S.down.length>20)S.down.shift();spark()}
function spark(){const d=S.down,mx=Math.max(...d,1);
 const p=d.map((v,i)=>(i*200/Math.max(d.length-1,1)).toFixed(1)+','+(40-v/mx*36).toFixed(1));
 $('#sp').setAttribute('d','M'+p.join(' L'));$('#sf').setAttribute('d','M0,44 L'+p.join(' L')+' L200,44Z')}
function links(l){document.querySelectorAll('.chip').forEach(c=>{const s=l[c.dataset.k]||'…';c.dataset.s=s;c.querySelector('em').textContent=s})}

function track(t){Object.assign(S.m,t);S.at=Date.now();
 $('#ttl').textContent=S.m.title||'Nothing playing';$('#art2').textContent=S.m.artist||'';
 $('#tg').setAttribute('d',S.m.state==='playing'?'M6 5h4v14H6zM14 5h4v14h-4z':'M8 5v14l11-7z');
 if('art' in t){const a=$('#art');a.style.backgroundImage=t.art?'url('+t.art+')':'';a.classList.toggle('cover',!!t.art)}
 tick()}
function tick(){const m=S.m;if(!m.duration||!m.title){$('#prog').style.width='0';return}
 const pos=Math.min(m.duration,(m.position||0)+(m.state==='playing'?(Date.now()-S.at)/1000:0));
 $('#prog').style.width=(pos/m.duration*100)+'%'}
setInterval(tick,500);

function cd(s){s=Math.max(0,s|0);const h=(s/3600)|0,m=((s%3600)/60)|0,x=s%60,p=n=>String(n).padStart(2,'0');return h?h+':'+p(m)+':'+p(x):p(m)+':'+p(x)}
function rem(v){const a=$('#alert');a.style.display=v.alert?'block':'none';a.textContent=v.alert||'';
 const it=(v.items||[])[0];
 if(!it){$('#tc').textContent='TIMER';$('#tv').textContent='STANDBY';$('#tl').textContent='';$('#tr').style.strokeDashoffset=0;return}
 const left=Math.max(0,Math.min(1,it.left/Math.max(1,it.total)));$('#tr').style.strokeDashoffset=276.5*(1-left);
 $('#tc').textContent=it.kind==='timer'?'TIMER':'REMINDER';$('#tv').textContent=it.kind==='timer'?cd(it.left):it.when;
 $('#tl').textContent=(it.label||'').toUpperCase().slice(0,22)}

function line(who,text){const l=$('#log');const near=l.scrollHeight-l.scrollTop-l.clientHeight<40;
 const d=document.createElement('div');const me=who.toLowerCase()==='you';
 d.className='msg '+(me?'me':'ai')+(!me&&/couldn.t reach|language model|offline/i.test(text)?' err':'');
 const s=document.createElement('small');s.textContent=who.toUpperCase();d.append(s,document.createTextNode(text));l.append(d);
 while(l.children.length>80)l.firstChild.remove();if(near)l.scrollTop=l.scrollHeight}

/* ---- Python -> page ---- */
window.HUD={push(m){switch(m.t){
 case'line':line(m.who,m.text);break;
 case'status':S.mode=m.v;paint();break;
 case'speaking':S.speaking=m.v;paint();break;
 case'mic':S.busy=m.busy;$('#mic').classList.toggle('busy',m.busy);break;
 case'stats':gauge('#gc',m.cpu);gauge('#gm',m.mem);if(m.links)links(m.links);if(m.net)net(m.net);break;
 case'track':track(m);break;
 case'rem':rem(m);break}}};

/* ---- page -> Python ---- */
function send(){const i=$('#in'),v=i.value.trim();if(!v)return;i.value='';api('send',v);if(!window.pywebview){line('You',v);demoReply()}}
$('#send').onclick=send;$('#in').onkeydown=e=>{if(e.key==='Enter')send()};
$('#bp').onclick=()=>api('media','previous');$('#bt').onclick=()=>api('media','toggle');$('#bn').onclick=()=>api('media','next');

function clock(){const d=new Date();$('#clk').textContent=d.toTimeString().slice(0,5);
 $('#dt').textContent=d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()+' · '+String(d.getDate()).padStart(2,'0')+' '+d.toLocaleDateString('en-US',{month:'short'}).toUpperCase()}
clock();setInterval(clock,10000);

/* ---- browser preview only (no pywebview) ---- */
function demoReply(){S.mode='THINKING';paint();setTimeout(()=>{line('JARVIS','Demo reply, sir.');S.mode='READY';paint()},1200)}
function demoVoice(){const at=(ms,f)=>setTimeout(()=>{if(S.voice)f()},ms);
 at(1000,()=>{S.mode='LISTENING';paint()});at(3000,()=>{S.mode='THINKING';paint();line('You','What time is it?')});
 at(4400,()=>{S.mode='READY';S.speaking=true;paint();line('JARVIS','It is 08:24 PM, sir.')});at(6000,()=>{S.speaking=false;paint()})}
setTimeout(()=>{if(window.pywebview||window.__jarvis)return;const P=HUD.push;
 line('JARVIS','Preview mode. Open through jarvis_ui.py for live data.');
 track({title:'Young Stunna, Skroef 28 & Nkosazana',artist:'Awakened Regal',state:'playing',position:60,duration:240});
 links({SPOTIFY:'ON',VOICE:'ON',SYSTEM:'ON'});
 setInterval(()=>{P({t:'stats',cpu:10+Math.random()*20,mem:89,net:{name:'NDTECH',ip:'192.168.2.78',wan:'197.245.105.43',online:true,
  down:Math.random()*20000,up:9000,down_text:(Math.random()*20).toFixed(1)+' KB/s',up_text:'11.7 KB/s'}})},1000)},4000);
paint();
</script>
</body>
</html>
